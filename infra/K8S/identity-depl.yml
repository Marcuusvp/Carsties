apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-svc
spec:
  selector:
    matchLabels:
      app: identity-svc
  template:
    metadata:
      labels:
        app: identity-svc
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: identity-svc
        image: marcusvp/identity-svc
        imagePullPolicy: Never
        envFrom: 
          - configMapRef:
              name: identity-svc-config
        ports:
        - containerPort: 80
        volumeMounts:
        - name: key-store
          mountPath: /app/keys
        - name: dataprotection-keys
          mountPath: /home/app/.aspnet/DataProtection-Keys
      volumes:
      - name: key-store
        emptyDir: {}
      - name: dataprotection-keys
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-clusterip
spec:
  type: ClusterIP
  selector:
    app: identity-svc
  ports:
  - port: 80
    targetPort: 80
